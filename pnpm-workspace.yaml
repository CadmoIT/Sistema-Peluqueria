# Define las aplicaciones y paquetes que componen el monorepo de TurnosRapidos.
packages:
  - "apps/*"
  - "packages/*"

# Instala las dependencias físicas en la raíz y evita árboles completos por aplicación.
nodeLinker: hoisted

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
  - "unrs-resolver"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - fast-xml-parser@5.3.4 || 5.3.5 || 5.3.6 || 5.3.8 || 5.5.6 || 5.5.7 || 5.7.0
  - postcss@8.5.10 || 8.5.12 || 8.5.18 || 8.5.23
  - uuid@11.1.1
  - deepmerge-ts@8.0.0
  - multer@2.3.0
overrides:
  deepmerge-ts@<8.0.0: ^8.0.0
  fast-xml-parser@<5.7.0: ^5.7.0
  fast-xml-parser@>=5.0.0 <5.3.5: ^5.3.5
  fast-xml-parser@>=5.0.0 <5.3.6: ^5.3.6
  fast-xml-parser@>=5.0.0 <5.3.8: ^5.3.8
  fast-xml-parser@>=5.0.0 <5.5.6: ^5.5.6
  fast-xml-parser@>=5.0.0 <5.5.7: ^5.5.7
  fast-xml-parser@>=5.0.9 <=5.3.3: ^5.3.4
  multer@<2.3.0: ^2.3.0
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  postcss@<=8.5.22: ^8.5.23
  uuid@<11.1.1: ^11.1.1
